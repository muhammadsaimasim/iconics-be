# Security additions for the iconics.neduet.edu.pk nginx site (audit H1, H5, C2).
# Merge into the existing server config; keep your existing ssl_certificate lines.
#
# 1) In the http {} block (e.g. /etc/nginx/conf.d/iconics-limits.conf):

limit_req_zone $binary_remote_addr zone=iconics_api:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=iconics_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=iconics_reg:10m   rate=10r/m;

# 2) Inside the existing `server { listen 443 ssl; server_name iconics.neduet.edu.pk ...; }` block:

server_tokens off;

# Files above this are rejected before reaching Express (2 x 10MB docs + form fields)
client_max_body_size 25m;

# Security headers for the SPA. "always" also adds them to error responses.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Tip: ship this first as Content-Security-Policy-Report-Only, click through the site
# (home, registration, contact map, admin panel) and check the browser console,
# then switch the header name to Content-Security-Policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

location /api/admin/login {
    limit_req zone=iconics_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:5000;
    include /etc/nginx/proxy_params;   # sets X-Forwarded-For etc.
}

location ~ ^/api/register/(workshop|participant|paper)$ {
    limit_req zone=iconics_reg burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:5000;
    include /etc/nginx/proxy_params;
}

location /api/ {
    limit_req zone=iconics_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:5000;
    include /etc/nginx/proxy_params;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:5000;
    include /etc/nginx/proxy_params;
}

# Note: nginx does not inherit add_header into a location that defines its own
# add_header. If any existing location block has add_header lines, repeat the
# security headers there.
